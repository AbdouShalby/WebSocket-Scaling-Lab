name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: |
          for f in src/*.js bench/*.js scripts/*.js; do node --check "$f"; done

      - name: Reject static credential-shaped material (offline guard)
        run: npm run check:secrets

      - name: Curated evidence integrity and finalization-tool regressions
        run: |
          npm run verify:evidence
          node --test tests/showcase.test.js

      - name: Unit + E2E tests
        run: npm test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: WS-1A benchmark integrity (real Redis required; no skip)
        run: npm run test:ws1a
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: WS-1B two-process cross-instance proof (real Redis required; no skip)
        run: npm run test:ws1b
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: WS-1C short 1/2/4-process harness gate (not capacity evidence)
        run: npm run test:ws1c
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Benchmark and integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-validation
          path: bench/results/

  operational:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install POSIX Redis test executable
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server
      - name: WS-2 real failures and negative controls (owned ephemeral processes only)
        run: npm run test:ws2
      - name: WS-3 security, readiness and telemetry (owned ephemeral processes only)
        run: npm run test:ws3
      - name: Operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: websocket-operational-validation
          path: bench/results/
