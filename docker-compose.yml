# Fleet topology: N ws instances behind nginx, one Redis, one publisher.
#
#   docker compose up --build --scale ws=4
#   curl http://localhost:8080/readyz
# This topology is not the measured direct-process fleet; see docs/reproduce.md.
#
services:
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  ws:
    build: .
    environment:
      REDIS_HOST: redis
      HOST: 0.0.0.0
    depends_on: [redis]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

  lb:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [ws]

  publisher:
    build: .
    command: ["node", "src/publisher.js", "--rate", "50", "--channels", "20"]
    environment:
      REDIS_HOST: redis
    depends_on: [redis]
